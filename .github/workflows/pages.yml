# Builds the GitHub Pages site and publishes it:
#   /        the Shinylive (in-browser) edition of the F1 Data Pit Wall Shiny app
#   /regs/   a static export of the 2025 vs 2026 regulations dashboard (regs_analyzer_25_26)
# Runs on every push to main, every Monday (to pick up new races) and on demand.
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::bslib
            any::data.table
            any::jsonlite
            any::plotly
            any::leaflet
            any::DT
            any::htmltools
            any::openssl

      - name: Fetch the data bundled into the web edition
        run: Rscript scripts/fetch_data.R --only=f1db,jolpica,circuits,tum

      - name: Build the Shinylive site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript scripts/build_web.R

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Reads the committed regs_analyzer_25_26/results/; no data download needed
      - name: Export the regulations dashboard to /regs/
        run: |
          python -m pip install --quiet pandas numpy pyarrow plotly dash
          python regs_analyzer_25_26/dashboard/export_static.py site/regs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
