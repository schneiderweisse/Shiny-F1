# Builds the Shinylive (in-browser) edition of the dashboard and publishes it to GitHub Pages.
# Runs on every push to main, every Monday (to pick up new races) and on demand.
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::bslib
            any::data.table
            any::jsonlite
            any::plotly
            any::leaflet
            any::DT
            any::htmltools
            any::openssl

      - name: Fetch the data bundled into the web edition
        run: Rscript scripts/fetch_data.R --only=f1db,jolpica,circuits,tum

      - name: Build the Shinylive site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript scripts/build_web.R

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
